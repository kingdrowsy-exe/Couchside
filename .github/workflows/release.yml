name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to attach the installer to. Leave empty to build without uploading."
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix web

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package the NSIS installer
        run: npx electron-builder --win nsis --publish never

      - name: Check the packaged UI
        shell: bash
        run: node scripts/check-packaged-ui.mjs release/win-unpacked

      - name: Locate installer
        id: installer
        shell: bash
        run: echo "path=$(node scripts/find-installer.mjs)" >> "$GITHUB_OUTPUT"

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Couchside-Setup
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: Attach installer to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.tag, 'v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
        run: node scripts/upload-release.mjs
